<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobility Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void:      #030812;
            --bg-base:      #07101f;
            --bg-panel:     #0a1828;
            --bg-elevated:  #0e2038;
            --bg-hover:     #122540;
            --blue-electric:#0077FF;
            --blue-bright:  #1a9eff;
            --blue-glow:    #00c8ff;
            --cyan:         #00e5ff;
            --text-primary: #ddeeff;
            --text-secondary:#6fa0cc;
            --text-muted:   #2e5070;
            --border-dim:   #0d2a47;
            --border-active:#0055bb;
            --border-glow:  #0077ff55;
            --success:      #00ffaa;
            --warning:      #ffaa00;
            --error:        #ff3860;
            --mode-metro:   #a855f7;
            --mode-train:   #22d3ee;
            --mode-bus:     #4ade80;
            --mode-cab:     #fb923c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg-void);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ── Scanline overlay ─────────────────────────────────── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0,119,255,0.012) 2px,
                    rgba(0,119,255,0.012) 4px
                );
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Grid background ──────────────────────────────────── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,119,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,119,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* ── Header ──────────────────────────────────────────── */
        .header {
            background: linear-gradient(90deg, var(--bg-void) 0%, var(--bg-panel) 50%, var(--bg-void) 100%);
            border-bottom: 1px solid var(--border-dim);
            padding: 0 28px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--blue-electric) 30%,
                var(--blue-glow) 50%,
                var(--blue-electric) 70%,
                transparent 100%
            );
            animation: scanbar 4s ease-in-out infinite;
        }

        @keyframes scanbar {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            position: relative;
        }

        .header-icon svg { width: 100%; height: 100%; }

        .header h1 {
            font-family: 'Barlow', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--blue-glow);
        }

        .header-sub {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }

        /* ── Layout ──────────────────────────────────────────── */
        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }

        /* ── Left Panel (Meetings Input) ─────────────────────── */
        .meetings-panel {
            width: 280px;
            flex-shrink: 0;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-dim);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .panel-header {
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--border-dim);
            font-family: 'Barlow', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: var(--blue-bright);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header::before {
            content: '';
            width: 3px;
            height: 14px;
            background: var(--blue-electric);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--blue-glow);
            flex-shrink: 0;
        }

        .panel-body {
            padding: 14px;
            flex: 1;
        }

        .field-label {
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .input-inline {
            display: flex;
            gap: 6px;
        }

        input[type="text"],
        input[type="time"],
        input[type="number"],
        input[type="file"],
        select {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-dim);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: 'Barlow', sans-serif;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--blue-electric);
            box-shadow: 0 0 0 3px rgba(0,119,255,0.15), 0 0 12px rgba(0,119,255,0.1);
        }

        input::placeholder { color: var(--text-muted); }

        select option { background: var(--bg-elevated); }

        /* Duration field narrower */
        #meetingDuration { max-width: 70px; }

        .btn {
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 16px;
            transition: all 0.2s;
            font-family: 'Fira Code', monospace;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--blue-electric);
            color: #fff;
            border: 1px solid transparent;
        }

        .btn-primary:hover {
            background: var(--blue-bright);
            box-shadow: 0 0 16px rgba(0,119,255,0.5);
            transform: translateY(-1px);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-primary:disabled {
            background: var(--bg-elevated);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-dim);
        }

        .btn-ghost:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
            background: var(--bg-elevated);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
        }

        .btn-add {
            background: var(--blue-electric);
            color: white;
            padding: 8px 12px;
            font-size: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            font-weight: 700;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-add:hover {
            background: var(--blue-bright);
            box-shadow: 0 0 12px rgba(0,119,255,0.4);
        }

        .divider {
            height: 1px;
            background: var(--border-dim);
            margin: 14px 0;
        }

        /* Meetings list in input panel */
        #meetingsList { margin-top: 6px; }

        .mtg-chip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            border-radius: 4px;
            padding: 5px 8px;
            margin-bottom: 5px;
            font-size: 11px;
            color: var(--text-secondary);
            font-family: 'Fira Code', monospace;
        }

        .mtg-chip .loc { color: var(--text-primary); font-size: 12px; }

        .mtg-remove {
            background: none;
            border: none;
            color: var(--error);
            cursor: pointer;
            font-size: 14px;
            padding: 0 2px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.15s;
        }

        .mtg-remove:hover { opacity: 1; }

        /* CSV upload */
        input[type="file"] {
            font-size: 11px;
            padding: 6px 8px;
            cursor: pointer;
        }

        #csvStatus {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            margin-top: 5px;
        }

        /* ── Chat Section ────────────────────────────────────── */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-base);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }
        .messages::-webkit-scrollbar-thumb:hover { background: var(--border-active); }

        /* ── Message Bubbles ─────────────────────────────────── */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: msg-in 0.25s ease-out;
        }

        @keyframes msg-in {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.agent {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-label {
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .message.user .message-label { color: var(--blue-bright); }
        .message.agent .message-label { color: var(--cyan); }

        .message-content {
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--blue-electric), #0055cc);
            color: #fff;
            border-bottom-right-radius: 3px;
            border: 1px solid rgba(0,119,255,0.4);
        }

        .message.agent .message-content {
            background: var(--bg-panel);
            color: var(--text-primary);
            border: 1px solid var(--border-dim);
            border-bottom-left-radius: 3px;
        }

        /* ── Input Bar ────────────────────────────────────────── */
        .input-bar {
            padding: 14px 20px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-dim);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #messageInput {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 12px 16px;
            font-size: 14px;
            font-family: 'Barlow', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #messageInput:focus {
            outline: none;
            border-color: var(--blue-electric);
            box-shadow: 0 0 0 3px rgba(0,119,255,0.12), 0 0 16px rgba(0,119,255,0.08);
        }

        #messageInput::placeholder { color: var(--text-muted); }

        #sendBtn {
            padding: 12px 22px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 100px;
            justify-content: center;
            flex-shrink: 0;
        }

        /* ── Right Sidebar (State) ───────────────────────────── */
        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: var(--bg-panel);
            border-left: 1px solid var(--border-dim);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar::-webkit-scrollbar { width: 3px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border-dim); }

        .sidebar-section {
            padding: 14px;
            border-bottom: 1px solid var(--border-dim);
        }

        .sidebar-section:last-child { border-bottom: none; }

        .state-label {
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .meeting-item {
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            border-left: 3px solid var(--blue-electric);
            border-radius: 5px;
            padding: 8px 10px;
            margin-bottom: 6px;
        }

        .meeting-location {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .meeting-time {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Preference chips */
        .pref-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,119,255,0.12);
            border: 1px solid rgba(0,119,255,0.3);
            color: var(--blue-bright);
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 12px;
            margin: 2px;
            white-space: nowrap;
        }

        .pref-x {
            cursor: pointer;
            color: var(--error);
            font-size: 12px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.15s;
        }

        .pref-x:hover { opacity: 1; }

        .state-value {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--text-muted);
        }

        .sidebar-actions {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: auto;
        }

        .sidebar-actions .btn {
            width: 100%;
            font-size: 11px;
            padding: 8px 12px;
            text-align: center;
        }

        /* ── Route Cards (JS-generated) ─────────────────────── */
        .route-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-dim);
            border-radius: 10px;
            padding: 14px;
            margin-top: 12px;
            width: 100%;
        }

        .route-card-title {
            font-family: 'Barlow', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--blue-bright);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .route-card-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-dim);
        }

        .section-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-dim);
            border-left: 4px solid var(--blue-electric);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .section-header {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
            margin-bottom: 6px;
        }

        .section-meta {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .leg-card {
            background: var(--bg-void);
            border: 1px solid var(--border-dim);
            border-left: 2px solid var(--success);
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }

        .leg-mode-badge {
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 2px 8px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .mode-metro  { background: rgba(168,85,247,0.2); color: var(--mode-metro); border: 1px solid rgba(168,85,247,0.4); }
        .mode-train  { background: rgba(34,211,238,0.15); color: var(--mode-train); border: 1px solid rgba(34,211,238,0.35); }
        .mode-bus    { background: rgba(74,222,128,0.15); color: var(--mode-bus); border: 1px solid rgba(74,222,128,0.3); }
        .mode-cab    { background: rgba(251,146,60,0.15); color: var(--mode-cab); border: 1px solid rgba(251,146,60,0.3); }

        .leg-route {
            font-size: 13px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .leg-stats {
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            color: var(--text-secondary);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .route-summary {
            border-top: 1px solid var(--border-dim);
            padding-top: 10px;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .summary-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .summary-stat .val {
            font-family: 'Barlow', sans-serif;
            font-size: 16px;
            font-weight: 700;
        }

        .summary-stat .lbl {
            font-family: 'Fira Code', monospace;
            font-size: 9px;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ── Warning / Action cards ───────────────────────────── */
        .warn-card {
            background: rgba(255,170,0,0.08);
            border: 1px solid rgba(255,170,0,0.3);
            border-radius: 8px;
            padding: 12px 14px;
            margin-top: 8px;
        }

        .warn-card .warn-text {
            font-size: 13px;
            color: var(--warning);
            margin-bottom: 10px;
        }

        .btn-warn {
            background: var(--warning);
            color: #000;
            border: none;
            border-radius: 5px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Fira Code', monospace;
            transition: all 0.2s;
        }

        .btn-warn:hover {
            background: #ffbb33;
            box-shadow: 0 0 12px rgba(255,170,0,0.4);
        }

        /* ── Location Pin Loader ─────────────────────────────── */

        /* Inline (button) loader */
        .pin-loader-inline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            position: relative;
        }

        .pin-loader-inline svg {
            animation: pin-bounce-sm 0.7s ease-in-out infinite alternate;
        }

        @keyframes pin-bounce-sm {
            from { transform: translateY(0); }
            to   { transform: translateY(-3px); }
        }

        /* Full message-area loader */
        .pin-loader-message {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-panel);
            border: 1px solid var(--border-dim);
            border-bottom-left-radius: 3px;
            border-radius: 10px;
        }

        .pin-loader-message .pin-wrap {
            position: relative;
            width: 36px;
            height: 44px;
            flex-shrink: 0;
        }

        /* Pin body (SVG) */
        .pin-svg {
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            animation: pin-bounce 0.8s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }

        @keyframes pin-bounce {
            from { transform: translateX(-50%) translateY(0); }
            to   { transform: translateX(-50%) translateY(-6px); }
        }

        /* Antenna glow pulse */
        .antenna-dot {
            animation: antenna-blink 1s ease-in-out infinite;
        }

        @keyframes antenna-blink {
            0%, 100% { opacity: 1; filter: drop-shadow(0 0 3px var(--cyan)); }
            50%       { opacity: 0.3; filter: none; }
        }

        /* Arms wiggle */
        .arm-left {
            animation: arm-wiggle-l 0.7s ease-in-out infinite alternate;
            transform-origin: 8px 18px;
        }

        .arm-right {
            animation: arm-wiggle-r 0.7s ease-in-out infinite alternate;
            transform-origin: 28px 18px;
        }

        @keyframes arm-wiggle-l {
            from { transform: rotate(-15deg); }
            to   { transform: rotate(10deg); }
        }

        @keyframes arm-wiggle-r {
            from { transform: rotate(15deg); }
            to   { transform: rotate(-10deg); }
        }

        /* Shadow under pin */
        .pin-shadow {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 5px;
            background: rgba(0,119,255,0.25);
            border-radius: 50%;
            animation: shadow-pulse 0.8s cubic-bezier(0.4,0,0.2,1) infinite alternate;
        }

        @keyframes shadow-pulse {
            from { transform: translateX(-50%) scaleX(1); opacity: 0.4; }
            to   { transform: translateX(-50%) scaleX(0.5); opacity: 0.1; }
        }

        .pin-loader-text {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .pin-loader-dots::after {
            content: '...';
            animation: dot-cycle 1.5s steps(4, end) infinite;
        }

        @keyframes dot-cycle {
            0%  { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
            100%{ content: ''; }
        }

        /* ── Error / Success inline ──────────────────────────── */
        .inline-error {
            background: rgba(255,56,96,0.1);
            border: 1px solid rgba(255,56,96,0.3);
            border-left: 3px solid var(--error);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--error);
            margin-top: 8px;
        }

        /* ── Responsive ──────────────────────────────────────── */
        @media (max-width: 1100px) {
            .meetings-panel { width: 230px; }
            .sidebar { width: 210px; }
        }

        @media (max-width: 820px) {
            .content { flex-direction: column; }
            .meetings-panel,
            .sidebar {
                width: 100%;
                border-right: none;
                border-left: none;
                border-bottom: 1px solid var(--border-dim);
                max-height: 160px;
            }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ── Header ─────────────────────────────────────────────── -->
    <div class="header">
        <div class="header-brand">
            <div class="header-icon">
                <!-- Mini pin icon in header -->
                <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="18" cy="14" rx="8" ry="8" fill="#0077FF" fill-opacity="0.3" stroke="#0077FF" stroke-width="1.5"/>
                    <circle cx="18" cy="14" r="3" fill="#00c8ff"/>
                    <path d="M18 22 L18 32" stroke="#0077FF" stroke-width="2" stroke-linecap="round"/>
                    <path d="M18 6 L18 2" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="18" cy="1.5" r="1.5" fill="#00e5ff"/>
                </svg>
            </div>
            <div>
                <h1>Mobility Agent</h1>
                <div class="header-sub">MUMBAI TRANSIT OPTIMIZER</div>
            </div>
        </div>
        <div class="header-status">
            <div class="status-dot"></div>
            SYSTEM ONLINE
        </div>
    </div>

    <!-- ── Main content ───────────────────────────────────────── -->
    <div class="content">

        <!-- Left: Meetings Input -->
        <div class="meetings-panel">
            <div class="panel-header">Meetings Input</div>
            <div class="panel-body">

                <label class="field-label">Location</label>
                <select id="meetingLocation" style="margin-bottom: 8px;">
                    <option value="">Select location...</option>
                </select>

                <div class="input-inline" style="margin-bottom: 8px;">
                    <div style="flex:1">
                        <label class="field-label">Time</label>
                        <input type="time" id="meetingTime" />
                    </div>
                    <div>
                        <label class="field-label">Mins</label>
                        <input type="number" id="meetingDuration" min="5" max="480" value="30" placeholder="30" />
                    </div>
                </div>

                <button class="btn-add" onclick="addMeeting()" style="width:100%; margin-bottom:10px;">+ Add Meeting</button>

                <div id="meetingsList"></div>

                <div class="divider"></div>

                <label class="field-label">Upload CSV Itinerary</label>
                <input type="file" id="csvFile" accept=".csv" style="margin-bottom: 6px;" />
                <button class="btn btn-ghost btn-sm" onclick="uploadCSV()" style="width:100%;">Upload CSV</button>
                <div id="csvStatus" style="display:none;"></div>

            </div>
        </div>

        <!-- Center: Chat -->
        <div class="chat-section">
            <div class="messages" id="messages"></div>

            <div class="input-bar">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask anything… 'plan my day', 'use metro for BKC leg', 'avoid bus'…"
                />
                <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    Send
                </button>
            </div>
        </div>

        <!-- Right: State sidebar -->
        <div class="sidebar">
            <div class="panel-header">Meetings</div>
            <div class="sidebar-section">
                <div id="sidebarMeetings" class="meetings-list">
                    <span class="state-value">No meetings added</span>
                </div>
            </div>

            <div class="panel-header" style="border-top:1px solid var(--border-dim);">Constraints</div>
            <div class="sidebar-section">
                <span class="state-label">Avoid Modes</span>
                <div id="avoidModes"><span class="state-value">None</span></div>
            </div>
            <div class="sidebar-section">
                <span class="state-label">Leg Constraints</span>
                <div id="legAvoidModes"><span class="state-value">None</span></div>
            </div>

            <div class="sidebar-actions">
                <button class="btn btn-ghost" onclick="exportChat()" style="font-size:11px;">
                    ↗ Export Chat
                </button>
                <button class="btn btn-ghost" onclick="clearChat()" style="font-size:11px; color: var(--error); border-color: rgba(255,56,96,0.3);">
                    ⌫ Clear Session
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let meetings = [];
    let state = { avoid_modes: [], leg_overrides: {}, leg_avoid_modes: {} };
    let availableLocations = [];
    let chatLog = [];

    const API_URL = window.location.origin;

    // ── SVG pin (reusable) ──────────────────────────────────────
    function pinSVG(size = 36) {
        const s = size;
        return `<svg width="${s}" height="${s}" viewBox="0 0 36 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Antenna -->
            <line x1="18" y1="5" x2="18" y2="1" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
            <circle class="antenna-dot" cx="18" cy="0.5" r="1.5" fill="#00e5ff"/>
            <!-- Left arm -->
            <line class="arm-left" x1="8" y1="16" x2="3" y2="13" stroke="#0077FF" stroke-width="2" stroke-linecap="round"/>
            <!-- Right arm -->
            <line class="arm-right" x1="28" y1="16" x2="33" y2="13" stroke="#0077FF" stroke-width="2" stroke-linecap="round"/>
            <!-- Pin body -->
            <path d="M18 6 C11 6 7 11 7 16 C7 22 18 33 18 33 C18 33 29 22 29 16 C29 11 25 6 18 6Z"
                fill="#0055cc" stroke="#0077FF" stroke-width="1.5"/>
            <!-- Inner circle -->
            <circle cx="18" cy="16" r="4.5" fill="#00c8ff" fill-opacity="0.9"/>
            <circle cx="18" cy="16" r="2" fill="white"/>
        </svg>`;
    }

    // Inline (button) pin loader
    function pinLoaderInline() {
        return `<span class="pin-loader-inline">${pinSVG(18)}</span>`;
    }

    // Full message-area loader element
    function createPinLoaderMessage() {
        const div = document.createElement('div');
        div.className = 'message agent';
        div.id = 'pin-loader-msg';
        div.innerHTML = `
            <div class="message-label">Agent</div>
            <div class="pin-loader-message">
                <div class="pin-wrap">
                    <div class="pin-svg">${pinSVG(36)}</div>
                    <div class="pin-shadow"></div>
                </div>
                <span class="pin-loader-text">Routing<span class="pin-loader-dots"></span></span>
            </div>`;
        return div;
    }

    // ── Mode badge helper ──────────────────────────────────────
    function modeBadge(mode) {
        const m = (mode || '').toLowerCase();
        return `<span class="leg-mode-badge mode-${m}">${m}</span>`;
    }

    // ── Format route HTML ──────────────────────────────────────
    function formatRouteHtml(route) {
        const hasSections = route && route.sections && route.sections.length > 0;
        const hasRoute    = route && route.route    && route.route.length > 0;
        if (!hasSections && !hasRoute) return '<p style="color:var(--text-muted);font-size:13px;">No route details available</p>';

        let html = `<div class="route-card">
            <div class="route-card-title">Route Details</div>`;

        if (hasSections) {
            route.sections.forEach(section => {
                html += `<div class="section-card">
                    <div class="section-header">${escapeHtml(section.from)} → ${escapeHtml(section.to)}</div>
                    <div class="section-meta">
                        <span>${escapeHtml(section.section_start)} – ${escapeHtml(section.section_end)} &nbsp;(${escapeHtml(section.section_time)})</span>
                        <span style="color:var(--success);">₹${escapeHtml(String(section.section_cost))}</span>
                    </div>`;
                section.legs.forEach(leg => {
                    html += `<div class="leg-card">
                        <div style="display:flex;align-items:center;gap:8px;">
                            ${modeBadge(leg.mode)}
                            <span class="leg-route">${escapeHtml(leg.from)} <span style="color:var(--text-muted);">→</span> ${escapeHtml(leg.to)}</span>
                        </div>
                        <div class="leg-stats">
                            <span style="color:var(--blue-bright);">${leg.time} min</span>
                            <span style="color:var(--success);">fare ₹${leg.cost}</span>
                            <span style="color:var(--text-muted);">reliability ${leg.reliability}</span>
                        </div>
                    </div>`;
                });
                html += `</div>`;
            });
        } else if (hasRoute) {
            route.route.forEach(leg => {
                const times = leg.start_time && leg.end_time && route.route.length > 1
                    ? `<span>${escapeHtml(leg.start_time)} – ${escapeHtml(leg.end_time)}</span>` : '';
                html += `<div class="leg-card">
                    <div style="display:flex;align-items:center;gap:8px;">
                        ${modeBadge(leg.mode)}
                        <span class="leg-route">${escapeHtml(leg.from)} <span style="color:var(--text-muted);">→</span> ${escapeHtml(leg.to)}</span>
                    </div>
                    <div class="leg-stats">
                        ${times}
                        <span style="color:var(--blue-bright);">${leg.time} min</span>
                        <span style="color:var(--success);">fare ₹${leg.cost}</span>
                        <span style="color:var(--text-muted);">reliability ${leg.reliability}</span>
                    </div>
                </div>`;
            });
        }

        html += `<div class="route-summary">
            <div class="summary-stat">
                <span class="val" style="color:var(--success);">₹${route.total_cost}</span>
                <span class="lbl">Total Cost</span>
            </div>
            <div class="summary-stat">
                <span class="val" style="color:var(--blue-bright);">${route.total_time}</span>
                <span class="lbl">Total Time</span>
            </div>
            <div class="summary-stat">
                <span class="val" style="color:var(--warning);">${route.delay_risk}</span>
                <span class="lbl">Delay Risk</span>
            </div>
        </div>`;

        html += `</div>`;
        return html;
    }

    // ── addMessage ─────────────────────────────────────────────
    function addMessage(content, role = 'user', details = null) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv  = document.createElement('div');
        messageDiv.className = `message ${role}`;

        let html = `<div class="message-label">${role === 'user' ? 'You' : 'Agent'}</div>`;
        html += `<div class="message-content"><div>${escapeHtml(content)}</div>`;

        if (details && role === 'agent') {
            if (details.error) {
                html += `<div class="inline-error">${escapeHtml(details.error)}</div>`;
            } else if (details.route || details.sections) {
                html += formatRouteHtml(details);
            }
        }

        html += `</div>`;
        messageDiv.innerHTML = html;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // ── Meeting management ─────────────────────────────────────
    async function loadLocations() {
        try {
            const response = await fetch(`${API_URL}/locations`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            availableLocations = data.locations.map(l => l.name);
            const select = document.getElementById('meetingLocation');
            availableLocations.forEach(location => {
                const option = document.createElement('option');
                option.value = location;
                option.textContent = location;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Failed to load locations:', error);
            addMessage('⚠️ Failed to load locations. Defaulting to manual entry.', 'agent');
        }
    }

    function setupLocationAutocomplete() {}

    function addMeeting() {
        const location = document.getElementById('meetingLocation').value.trim();
        const time     = document.getElementById('meetingTime').value;
        const duration = parseInt(document.getElementById('meetingDuration').value) || 30;

        if (!location || !time) { addMessage('Please select a location and time.', 'agent'); return; }

        meetings.push({ location, start_time: time, duration_minutes: duration });
        document.getElementById('meetingLocation').value = '';
        document.getElementById('meetingTime').value     = '';
        document.getElementById('meetingDuration').value = '30';
        updateMeetingsList();
        addMessage(`Meeting added: ${location} at ${time} (${duration} min)`, 'agent');
    }

    function updateMeetingsList() {
        const sidebarMeetings = document.getElementById('sidebarMeetings');
        const meetingsList    = document.getElementById('meetingsList');
        const dur = m => m.duration_minutes ? `${m.duration_minutes}m` : '30m';

        sidebarMeetings.innerHTML = meetings.length === 0
            ? '<span class="state-value">No meetings added</span>'
            : meetings.map((m, i) => `
                <div class="meeting-item">
                    <div class="meeting-location">${escapeHtml(m.location)}</div>
                    <div class="meeting-time">${escapeHtml(m.start_time)} · ${dur(m)}</div>
                </div>`).join('');

        meetingsList.innerHTML = meetings.map((m, i) => `
            <div class="mtg-chip">
                <span><span class="loc">${escapeHtml(m.location)}</span> · ${escapeHtml(m.start_time)} · ${dur(m)}</span>
                <button class="mtg-remove" onclick="removeMeeting(${i})">✕</button>
            </div>`).join('');
    }

    function removeMeeting(index) {
        meetings.splice(index, 1);
        updateMeetingsList();
        addMessage(`Meeting ${index + 1} removed.`, 'agent');
    }

    async function uploadCSV() {
        const fileInput = document.getElementById('csvFile');
        const statusDiv = document.getElementById('csvStatus');
        if (!fileInput.files || !fileInput.files[0]) {
            statusDiv.textContent = '⚠️ Please select a CSV file';
            statusDiv.style.display = 'block';
            statusDiv.style.color = 'var(--warning)';
            return;
        }
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        try {
            statusDiv.textContent = 'Uploading…';
            statusDiv.style.display = 'block';
            statusDiv.style.color = 'var(--text-secondary)';
            const response = await fetch(`${API_URL}/upload_itinerary`, { method: 'POST', body: formData });
            const data     = await response.json();
            if (data.error) {
                statusDiv.textContent = `❌ ${data.error}`;
                statusDiv.style.color = 'var(--error)';
                return;
            }
            meetings = data.meetings;
            updateMeetingsList();
            statusDiv.textContent = `✓ Loaded ${data.count} meetings`;
            statusDiv.style.color = 'var(--success)';
            fileInput.value = '';
            addMessage(`Loaded ${data.count} meetings from CSV.`, 'agent');
            setTimeout(() => sendMessage('plan my day'), 250);
        } catch (error) {
            statusDiv.textContent = `❌ Upload failed: ${error.message}`;
            statusDiv.style.color = 'var(--error)';
        }
    }

    // ── sendMessage ────────────────────────────────────────────
    async function sendMessage(messageOverride) {
        const input   = document.getElementById('messageInput');
        const message = (typeof messageOverride === 'string' && messageOverride.length > 0)
            ? messageOverride : input.value.trim();
        if (!message) { addMessage('Please enter a message.', 'agent'); return; }
        if (meetings.length === 0) { addMessage('Add at least one meeting before sending.', 'agent'); return; }

        chatLog.push({ role: 'user', text: message, ts: new Date().toISOString() });
        addMessage(message, 'user');
        if (!messageOverride) input.value = '';

        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;
        sendBtn.innerHTML = `${pinLoaderInline()} Routing…`;

        // Show message-area pin loader
        const loaderMsg = createPinLoaderMessage();
        document.getElementById('messages').appendChild(loaderMsg);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

        try {
            const response = await fetch(`${API_URL}/chat`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ message, meetings })
            });
            if (!response.ok) throw new Error(`API error: ${response.status}`);
            const data = await response.json();

            // Remove pin loader
            loaderMsg.remove();

            if (data.memory) {
                state.avoid_modes    = data.memory.avoid_modes    || [];
                state.leg_overrides  = data.memory.leg_overrides  || {};
                state.leg_avoid_modes= data.memory.leg_avoid_modes|| {};
            }
            if (data.result && data.result.route) updateStateDisplay();

            const action = data.decision?.action || 'unknown';
            const result = data.result || {};
            let responseText = '';

            if (action === 'plan' || action === 'replan') {
                if (result && result.status === 'failed') {
                    const reason = result.reason || 'No feasible route';
                    responseText = `Planning failed: ${reason}`;
                    if (result.failed_override) {
                        addMessage(responseText, 'agent', { error: reason });
                        showOverrideWarning(result.failed_override);
                    } else {
                        addMessage(responseText, 'agent', { error: reason });
                        if (state.avoid_modes && state.avoid_modes.length > 0) showPreferenceWarning(state.avoid_modes);
                    }
                } else {
                    responseText = 'Your day is planned!';
                    addMessage(responseText, 'agent', result);
                }
            } else if (action === 'update_preferences') {
                responseText = `Preferences updated. Avoiding: ${result.avoid_modes.join(', ')}`;
                addMessage(responseText, 'agent', result);
            } else if (action === 'edit_leg') {
                responseText = `Leg override set — ${result.from} → ${result.to}: ${result.mode}`;
                addMessage(responseText, 'agent', result);
            } else if (action === 'avoid_mode_on_leg') {
                responseText = `Avoiding ${result.avoid.join(', ')} on ${result.from} → ${result.to}`;
                addMessage(responseText, 'agent', result);
            } else if (action === 'clear_leg_override' || action === 'clear_leg_preference') {
                responseText = `Cleared preferences for ${result.from} → ${result.to}` + (result.cleared ? ` (${result.cleared})` : '');
                addMessage(responseText, 'agent', result);
            } else if (action === 'explain') {
                responseText = 'Here is your planned route.';
                addMessage(responseText, 'agent', result);
            } else if (action === 'what_if') {
                responseText = result.message || "I evaluated that change. Reply 'yes' to apply it.";
                addMessage(responseText, 'agent', result);
            } else if (action === 'plan_query') {
                responseText = result.message || 'Here is what the current plan shows for that leg.';
                addMessage(responseText, 'agent', result);
            } else if (action === 'unclear') {
                responseText = result.message || "I didn't understand that. Could you rephrase?";
                addMessage(responseText, 'agent', result);
            } else if (action === 'no_action') {
                responseText = result.message || 'No change applied.';
                addMessage(responseText, 'agent', result);
            } else {
                responseText = result.message || JSON.stringify(result, null, 2).substring(0, 200);
                addMessage(responseText, 'agent', result);
            }
            chatLog.push({ role: 'agent', text: responseText, action, result, memory: state, ts: new Date().toISOString() });
            updateStateDisplay();

        } catch (error) {
            loaderMsg.remove();
            chatLog.push({ role: 'agent', text: `Error: ${error.message}`, ts: new Date().toISOString() });
            addMessage(`Error: ${error.message}`, 'agent');
        } finally {
            sendBtn.disabled = false;
            sendBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send`;
        }
    }

    // ── Warning cards ──────────────────────────────────────────
    function showPreferenceWarning(avoidModes) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv  = document.createElement('div');
        messageDiv.className = 'message agent';
        messageDiv.innerHTML = `
            <div class="message-label">Agent</div>
            <div class="message-content">
                <div class="warn-card">
                    <div class="warn-text">⚠️ Active avoid modes may be causing infeasibility: <strong>${escapeHtml(avoidModes.join(', '))}</strong></div>
                    <button id="revert-pref-btn" class="btn-warn">Clear preferences & replan</button>
                </div>
            </div>`;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        messageDiv.querySelector('#revert-pref-btn').addEventListener('click', async () => {
            try {
                const resp = await fetch(`${API_URL}/clear_preferences`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await resp.json();
                if (data && data.status === 'ok') {
                    state.avoid_modes = [];
                    updateStateDisplay();
                    addMessage('Cleared global preferences. Replanning…', 'agent');
                    setTimeout(() => sendMessage('plan my day'), 200);
                } else {
                    addMessage(`Failed to clear preferences: ${data.error || JSON.stringify(data)}`, 'agent');
                }
            } catch (e) { addMessage(`Error clearing preferences: ${e.message}`, 'agent'); }
        });
    }

    function showOverrideWarning(failedOverride) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv  = document.createElement('div');
        messageDiv.className = 'message agent';
        const { from, to, mode = '(unspecified)' } = failedOverride;
        messageDiv.innerHTML = `
            <div class="message-label">Agent</div>
            <div class="message-content">
                <div class="warn-card">
                    <div class="warn-text">⚠️ Override <strong>${escapeHtml(from)} → ${escapeHtml(to)}</strong> (mode: ${escapeHtml(mode)}) made the plan infeasible.</div>
                    <button id="revert-btn" class="btn-warn">Revert override & replan</button>
                </div>
            </div>`;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        messageDiv.querySelector('#revert-btn').addEventListener('click', async () => {
            try {
                const resp = await fetch(`${API_URL}/clear_leg_override`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from, to })
                });
                const data = await resp.json();
                if (data && data.status === 'ok') {
                    addMessage(`Reverted override ${from} → ${to}. Replanning…`, 'agent');
                    setTimeout(() => sendMessage('plan my day'), 200);
                } else {
                    addMessage(`Failed to clear override: ${data.error || JSON.stringify(data)}`, 'agent');
                }
            } catch (e) { addMessage(`Error clearing override: ${e.message}`, 'agent'); }
        });
    }

    // ── State display ──────────────────────────────────────────
    function updateStateDisplay() {
        const avoidEl = document.getElementById('avoidModes');
        if (state.avoid_modes && state.avoid_modes.length > 0) {
            avoidEl.innerHTML = state.avoid_modes.map(mode =>
                `<span class="pref-chip">${escapeHtml(mode)}<span class="pref-x" onclick="removeAvoidMode('${escapeHtml(mode)}')">✕</span></span>`
            ).join(' ');
        } else {
            avoidEl.innerHTML = '<span class="state-value">None</span>';
        }

        const legEl = document.getElementById('legAvoidModes');
        const chips = [];

        if (state.leg_overrides) {
            for (const legKey in state.leg_overrides) {
                const override = state.leg_overrides[legKey];
                const parts = legKey.split('->');
                chips.push(`<span class="pref-chip">${escapeHtml(legKey)}: force [${escapeHtml(override.mode || '?')}]<span class="pref-x" onclick="removeLegOverride('${escapeHtml(parts[0])}','${escapeHtml(parts[1])}')">✕</span></span>`);
            }
        }
        if (state.leg_avoid_modes) {
            for (const legKey in state.leg_avoid_modes) {
                const constraint = state.leg_avoid_modes[legKey];
                const modes = constraint.avoid ? constraint.avoid.join(', ') : '?';
                const parts = legKey.split('->');
                chips.push(`<span class="pref-chip">${escapeHtml(legKey)}: avoid [${escapeHtml(modes)}]<span class="pref-x" onclick="removeLegAvoid('${escapeHtml(parts[0])}','${escapeHtml(parts[1])}')">✕</span></span>`);
            }
        }
        legEl.innerHTML = chips.length > 0 ? chips.join(' ') : '<span class="state-value">None</span>';
    }

    // ── Constraint removal ─────────────────────────────────────
    async function removeAvoidMode(mode) {
        try {
            const res  = await fetch(`${API_URL}/remove_avoid_mode`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode }) });
            const data = await res.json();
            if (data.status === 'ok') { state.avoid_modes = data.avoid_modes || []; updateStateDisplay(); addMessage(`Removed global avoid: ${mode}`, 'agent'); }
        } catch (e) { addMessage(`Error removing avoid mode: ${e.message}`, 'agent'); }
    }

    async function removeLegOverride(from, to) {
        try {
            const res  = await fetch(`${API_URL}/clear_leg_override`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from, to }) });
            const data = await res.json();
            if (data.status === 'ok') { delete state.leg_overrides[`${from}->${to}`]; updateStateDisplay(); addMessage(`Removed leg override: ${from} → ${to}`, 'agent'); }
        } catch (e) { addMessage(`Error removing leg override: ${e.message}`, 'agent'); }
    }

    async function removeLegAvoid(from, to) {
        try {
            const res  = await fetch(`${API_URL}/clear_leg_avoid`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from, to }) });
            const data = await res.json();
            if (data.status === 'ok') { delete state.leg_avoid_modes[`${from}->${to}`]; updateStateDisplay(); addMessage(`Removed leg avoid: ${from} → ${to}`, 'agent'); }
        } catch (e) { addMessage(`Error removing leg avoid: ${e.message}`, 'agent'); }
    }

    // ── Export / Clear ─────────────────────────────────────────
    function exportChat() {
        if (chatLog.length === 0) { addMessage('Nothing to export yet — start a conversation first.', 'agent'); return; }
        const json = JSON.stringify({ exported_at: new Date().toISOString(), meetings, state, messages: chatLog }, null, 2);
        navigator.clipboard.writeText(json).then(() => {
            addMessage('Chat log copied to clipboard.', 'agent');
        }).catch(() => {
            const blob = new Blob([json], { type: 'application/json' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url; a.download = 'chat_export.json'; a.click();
            URL.revokeObjectURL(url);
            addMessage('Chat log downloaded as chat_export.json', 'agent');
        });
    }

    async function clearChat() {
        document.getElementById('messages').innerHTML = '';
        meetings = []; state = { avoid_modes: [], leg_overrides: {}, leg_avoid_modes: {} }; chatLog = [];
        updateMeetingsList(); updateStateDisplay();
        try {
            await fetch(`${API_URL}/reset_state`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        } catch (e) { console.error('Failed to reset backend state:', e); }
        addMessage('Session cleared. Add meetings to start planning.', 'agent');
    }

    // ── Util ───────────────────────────────────────────────────
    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const map = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'": '&#039;' };
        return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    // ── Init ───────────────────────────────────────────────────
    document.getElementById('messageInput').addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });

    loadLocations();
    addMessage("Welcome. Add your meetings and I'll plan the optimal route across Mumbai.", 'agent');
</script>
</body>
</html>
